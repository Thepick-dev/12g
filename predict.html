<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LMS XII - Predict</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff;
  --text:#000000;
  --gap-large:48px;
  --gap-mid:28px;
  --card-radius:12px;
  --team-box-padding:10px 14px;
  --team-box-width:140px;
  --team-box-height:48px;
  --accent-orange:#ff8a2b;
  --accent-pink:#ff007f;
  --accent-blue:#00f2ff;
  --accent-yellow:#ffd400;
  --accent-green:#00ff7f;
  --accent-purple:#b200ff;
  --accent-red:#ff0044;
  --accent-cyan:#00ffd4;
}

body { margin:0; font-family:"League Gothic", Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; }
a { text-decoration:none; color:inherit; }
.container { max-width:960px; width:100%; padding:20px; box-sizing:border-box; }

.nav { width:100%; display:flex; justify-content:center; gap:28px; padding:12px 0; }
.nav a { font-weight:700; font-size:22px; text-transform:uppercase; font-style:italic; color:#000; }
.nav a.current { color:var(--accent-orange); }

h1.title { 
  font-family:"Bebas Neue", sans-serif;
  font-weight:400;
  font-size:clamp(100px,12vw,160px);
  margin:40px 0 10px;
  text-align:center;
  padding:20px;
  border:2px solid;
  border-image: linear-gradient(90deg, #ff8a2b, #00f2ff, #ffd400) 1;
  border-radius:8px;
  box-shadow: inset 0 -4px 10px rgba(0,0,0,0.04);
}

.tagline { font-size:clamp(26px,5vw,36px); text-transform:uppercase; font-weight:700; color:var(--accent-orange); text-align:center; margin-bottom:var(--gap-large); }

main { width:100%; max-width:960px; padding:0 12px; text-align:center; }

/* Top Questions */
.top-questions { background:#fff; border-radius:var(--card-radius); padding:18px; margin-bottom:var(--gap-mid); box-shadow:0 8px 24px rgba(0,0,0,0.04); text-align:left; }
.row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.col { flex:1; min-width:220px; }
.label { font-weight:900; margin-bottom:6px; display:block; font-size:15px; color:#222; letter-spacing:0.6px; }
.select, .input, .button { width:100%; padding:12px 14px; border-radius:8px; border:1px solid #ddd; font-size:16px; box-sizing:border-box; font-family:inherit; }
.button { background:#000;color:#fff;border:none;cursor:pointer;padding:14px 18px; font-weight:900; text-transform:uppercase; font-size:18px; }

/* Player nav */
.player-nav { display:flex; gap:8px; justify-content:center; margin:18px 0 28px; flex-wrap:wrap; }
.player-nav button { border:none; padding:12px 18px; border-radius:8px; font-weight:900; cursor:pointer; text-transform:uppercase; font-style:italic; color:#fff; }
.player-nav button.active { outline:3px solid rgba(0,0,0,0.12); }

/* Player area */
.player-area { margin-bottom:var(--gap-mid); padding:18px; border-radius:var(--card-radius); background:#fff; box-shadow:0 10px 30px rgba(0,0,0,0.06); text-align:left; border:1px solid rgba(0,0,0,0.04); }
.player-title { display:flex; align-items:center; gap:12px; justify-content:space-between; }
.player-name { font-size:28px; font-weight:900; text-transform:uppercase; letter-spacing:0.6px; }
.player-total { font-size:18px; font-weight:900; text-transform:uppercase; color:#222; }
.subtle { color:#666; font-size:13px; }
.fixtures { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; align-items:center; }
.team-box { width: var(--team-box-width); height: var(--team-box-height); display:flex; align-items:center; justify-content:center; padding: var(--team-box-padding); border-radius:8px; text-align:center; font-weight:900; text-transform:uppercase; box-shadow:0 6px 18px rgba(0,0,0,0.04); cursor:pointer; color:#000; flex-shrink:0; }
.team-box.disabled { background:#e9e9e9; color:#000; cursor:default; opacity:0.95; }
.picked-list { margin-top:12px; padding:12px; background:#fafafa; border-radius:8px; border:1px dashed #eee; min-height:48px; }
.picked-list strong { display:block; margin-bottom:8px; text-transform:uppercase; }
.points-grid { margin-top:12px; overflow:auto; }
.points-grid table { width:100%; border-collapse:collapse; }
.points-grid th, .points-grid td { padding:8px 10px; text-align:center; border-bottom:1px solid #f0f0f0; font-size:14px; }
.points-grid th { font-weight:800; text-transform:uppercase; font-size:13px; }
.points-grid td.team { text-align:left; font-weight:700; color:#000; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="predict.html" class="current">Predict</a>
    <a href="table.html">Table</a>
    <a href="rules.html">Rules</a>
  </nav>

  <header>
    <h1 class="title">LMS XII</h1>
    <div class="tagline">CHOOSE <s style="color:inherit">HARV</s></div>
  </header>

  <main>
    <!-- Player content and top pick boxes as in previous full predict.html -->
    <section class="top-questions" aria-labelledby="top-questions-label">
      <div id="top-questions-label" class="label" style="font-size:18px">PICK!</div>
      <div class="row" style="margin-top:8px;">
        <div class="col">
          <label class="label">YOUR NAME</label>
          <select id="top-name" class="select">
            <option value="">-- CHOOSE YOUR NAME --</option>
            <option value="BILLY">BILLY</option>
            <option value="CROSBO">CROSBO</option>
            <option value="INGZ">INGZ</option>
            <option value="KABZ">KABZ</option>
            <option value="KIT">KIT</option>
            <option value="LOCKY">LOCKY</option>
            <option value="STOOBZ">STOOBZ</option>
            <option value="T-CITY">T-CITY</option>
          </select>
        </div>
        <div class="col">
          <label class="label">TEAM FOR THE WEEK</label>
          <select id="top-team" class="select">
            <option value="">-- CHOOSE A TEAM --</option>
            <option>Arsenal</option>
            <option>Aston Villa</option>
            <option>Bournemouth</option>
            <option>Brentford</option>
            <option>Brighton</option>
            <option>Burnley</option>
            <option>Chelsea</option>
            <option>Palace</option>
            <option>Everton</option>
            <option>Fulham</option>
            <option>Leeds</option>
            <option>Liverpool</option>
            <option>Man City</option>
            <option>Man Utd</option>
            <option>Newcastle</option>
            <option>Forest</option>
            <option>Sunderland</option>
            <option>Spurs</option>
            <option>West Ham</option>
            <option>Wolves</option>
          </select>
        </div>
        <div class="col">
          <label class="label">PLAYER</label>
          <input id="top-player" class="input" placeholder="ENTER PLAYER NAME">
        </div>
      </div>
      <hr style="margin:16px 0; border:none; border-top:1px solid #eee;">
      <div style="display:flex; gap:10px;">
        <button class="button" id="submitPick">SUBMIT PICK</button>
      </div>
    </section>

    <div class="player-nav" role="navigation" aria-label="Jump to player">
      <button data-player="BILLY" style="background:var(--accent-pink)">BILLY</button>
      <button data-player="CROSBO" style="background:var(--accent-orange)">CROSBO</button>
      <button data-player="INGZ" style="background:var(--accent-blue)">INGZ</button>
      <button data-player="KABZ" style="background:var(--accent-yellow)">KABZ</button>
      <button data-player="KIT" style="background:var(--accent-green)">KIT</button>
      <button data-player="LOCKY" style="background:var(--accent-purple)">LOCKY</button>
      <button data-player="STOOBZ" style="background:var(--accent-red)">STOOBZ</button>
      <button data-player="T-CITY" style="background:var(--accent-cyan)">T-CITY</button>
    </div>

    <section id="players"></section>

  </main>
</div>

<script>
// JS logic as in previous predict.html, creating player panels, fixtures, points grid
</script>
</body>
</html>
