<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LMS XII - Predict</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff;
  --text:#000000;
  --gap-large:48px;
  --gap-mid:28px;
  --accent-orange:#ff8a2b;
  --player-colors: {
    BILLY: #ff007f;
    CROSBO: #00f2ff;
    INGZ: #ffd400;
    KABZ: #ff00ff;
    KIT: #00ff7f;
    LOCKY: #ff5500;
    STOOBZ: #007fff;
    T-CITY: #ffdd00;
  };
}
body { margin:0; font-family:"League Gothic", Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; }
a { text-decoration:none; color:inherit; }
.container { max-width:960px; width:100%; padding:20px; box-sizing:border-box; }

.nav { width:100%; display:flex; justify-content:center; gap:28px; padding:12px 0; }
.nav a { font-weight:700; font-size:22px; text-transform:uppercase; font-style:italic; color:#000; }
.nav a.current { color:var(--accent-orange); }

h1.title { 
  font-family:"Bebas Neue", sans-serif;
  font-weight:400;
  font-size:clamp(100px,12vw,160px);
  margin:40px 0 10px;
  text-align:center;
  padding:20px;
  border:2px solid;
  border-image: linear-gradient(90deg, #ff8a2b, #00f2ff, #ffd400) 1;
  border-radius:8px;
  box-shadow: inset 0 -4px 10px rgba(0,0,0,0.04);
}

.tagline { font-size:clamp(26px,5vw,36px); text-transform:uppercase; font-weight:700; color:var(--accent-orange); text-align:center; margin-bottom:var(--gap-large); }

main { width:100%; max-width:960px; padding:0 12px; text-align:center; }

.player-nav { display:flex; gap:8px; justify-content:center; margin-bottom:var(--gap-mid); flex-wrap:wrap; }
.player-nav button { font-weight:900; padding:12px 18px; border-radius:8px; border:none; cursor:pointer; text-transform:uppercase; font-style:italic; color:#fff; }
.player-area { margin-bottom:var(--gap-mid); padding:18px; border-radius:12px; background:#fff; border:1px solid #ddd; box-shadow:0 8px 24px rgba(0,0,0,0.04); }
.team-box { display:inline-flex; align-items:center; justify-content:center; padding:10px 14px; margin:2px; border-radius:8px; font-weight:900; text-transform:uppercase; color:#000; cursor:pointer; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="predict.html" class="current">Predict</a>
    <a href="table.html">Table</a>
    <a href="rules.html">Rules</a>
  </nav>

  <header>
    <h1 class="title">LMS XII</h1>
    <div class="tagline">CHOOSE <s>LIFE</s> HARV</div>
  </header>

  <main>
    <div class="player-nav" id="playerNav"></div>
    <div id="players"></div>
  </main>
</div>

<script>
const PLAYERS = [
  {id:'BILLY', color:'#ff007f'},
  {id:'CROSBO', color:'#00f2ff'},
  {id:'INGZ', color:'#ffd400'},
  {id:'KABZ', color:'#ff00ff'},
  {id:'KIT', color:'#00ff7f'},
  {id:'LOCKY', color:'#ff5500'},
  {id:'STOOBZ', color:'#007fff'},
  {id:'T-CITY', color:'#ffdd00'}
];

const TEAMS = ['Arsenal','Aston Villa','Bournemouth','Brentford','Brighton','Burnley','Chelsea','Palace','Everton','Fulham','Leeds','Liverpool','Man City','Man Utd','Newcastle','Forest','Sunderland','Spurs','West Ham','Wolves'];

const nav = document.getElementById('playerNav');
const container = document.getElementById('players');

PLAYERS.forEach(p=>{
  const btn = document.createElement('button');
  btn.textContent = p.id;
  btn.style.background=p.color;
  btn.addEventListener('click', ()=>document.getElementById('player-'+p.id).scrollIntoView({behavior:'smooth'}));
  nav.appendChild(btn);

  const area = document.createElement('div');
  area.id='player-'+p.id;
  area.className='player-area';
  area.style.borderColor=p.color;

  let html = `<h2 style="color:${p.color}">${p.id}</h2>`;
  html += `<div class="team-boxes">`;
  TEAMS.forEach(t=>html+=`<div class="team-box" style="background:${p.color}">${t}</div>`);
  html += `</div>`;
  area.innerHTML=html;
  container.appendChild(area);
});
</script>
</body>
</html>
