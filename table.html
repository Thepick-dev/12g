<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LMS XII - Table</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=League+Gothic&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#ffffff;
  --text:#000000;
  --gap-large:48px;
  --gap-mid:28px;
  --accent-table:#00f2ff;
}
body { margin:0; font-family:"League Gothic", Arial, sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; align-items:center; }
a { text-decoration:none; color:inherit; }
.container { max-width:960px; width:100%; padding:20px; box-sizing:border-box; }

.nav { width:100%; display:flex; justify-content:center; gap:28px; padding:12px 0; }
.nav a { font-weight:700; font-size:22px; text-transform:uppercase; font-style:italic; color:#000; }
.nav a.current { color:var(--accent-table); }

h1.title { 
  font-family:"Bebas Neue", sans-serif;
  font-weight:400;
  font-size:clamp(100px,12vw,160px);
  margin:40px 0 10px;
  text-align:center;
  padding:20px;
  border:2px solid;
  border-image: linear-gradient(90deg, #00f2ff, #ff007f, #ffd400) 1;
  border-radius:8px;
  box-shadow: inset 0 -4px 10px rgba(0,0,0,0.04);
}

.tagline { font-size:clamp(26px,5vw,36px); text-transform:uppercase; font-weight:700; color:var(--accent-table); text-align:center; margin-bottom:var(--gap-large); }

main { width:100%; max-width:960px; padding:0 12px; text-align:center; }

table { width:100%; border-collapse:collapse; }
th, td { border:1px solid #ddd; padding:10px; text-align:center; font-weight:700; }
th { background:#f0f0f0; }
.star { font-weight:900; color:#ffb400; }
</style>
</head>
<body>
<div class="container">
  <nav class="nav">
    <a href="index.html">Home</a>
    <a href="predict.html">Predict</a>
    <a href="table.html" class="current">Table</a>
    <a href="rules.html">Rules</a>
  </nav>

  <header>
    <h1 class="title">LMS XII</h1>
    <div class="tagline">WEEKLY STANDINGS</div>
  </header>

  <main>
    <table>
      <thead>
        <tr>
          <th>Player</th>
          <th>Team Pick</th>
          <th>Team Points</th>
          <th>Player Pick</th>
          <th>Player Points</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>BILLY</td><td>Arsenal</td><td>5 STAR</td><td>Haaland</td><td>4 STAR</td><td>9 STAR</td></tr>
        <tr><td>CROSBO</td><td>Liverpool</td><td>3 STAR</td><td>Son</td><td>5 STAR</td><td>8 STAR</td></tr>
        <tr><td>INGZ</td><td>Man City</td><td>4 STAR</td><td>Haaland</td><td>3 STAR</td><td>7 STAR</td></tr>
        <tr><td>KABZ</td><td>Chelsea</td><td>2 STAR</td><td>Kane</td><td>5 STAR</td><td>7 STAR</td></tr>
      </tbody>
    </table>
  </main>
</div>
</body>
</html>
